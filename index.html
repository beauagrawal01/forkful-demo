<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Schibsted+Grotesk:wght@600;700;800&display=swap">
<style>
/* Layout: one phone-sized app surface (full-bleed on phones, framed on desktop) with a floating pill nav; a side note panel appears only on wide screens. */
:root{
  --bg:#ffffff; --surface:#f3f3f0; --surface2:#e8e8e4; --fg:#0c0c0d; --muted:#5e5e63; --line:#e5e5e1;
  --accent:#2a46c9; --accent-fg:#ffffff; --plus:#a3248f; --deal:#c9321f; --deal-fg:#ffffff; --good:#17734a; --good-bg:#e4f3ea; --value-bg:#fbe3df;
  --band:#2f7a4d;--stage:#e6e5df; --map:#e9e8e4; --road:#ffffff; --roadedge:#cdcdd1; --road2:#fffdf7; --block:#dbe0e6; --park:#cfe3c4; --water:#9ec3ee; --shore:#cddfc0; --maplabel:#74798a; --maplabel2:#4a4f5e; --waterlabel:#4a78b8; --shade:#c8c3b5; --star:#e8a713; --shadow:0 4px 16px rgba(10,10,20,.14);
  --display:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif; --body:"Figtree","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111113; --surface:#1e1e21; --surface2:#2b2b2f; --fg:#f4f4f1; --muted:#a4a4aa; --line:#2c2c31;
  --accent:#5b78ff; --accent-fg:#ffffff; --plus:#e57ad6; --deal:#e2523e; --deal-fg:#ffffff; --good:#5fcf95; --good-bg:#16301f; --value-bg:#3a1d19;
  --band:#1f5a38;--stage:#050506; --map:#34465a; --road:#5a6a80; --roadedge:#465770; --road2:#7b8aa8; --block:#252a30; --park:#1f5c58; --water:#2150b8; --shore:#55634f; --maplabel:#a9b6cb; --maplabel2:#d0d9e8; --waterlabel:#8fb0ff; --shade:#1d2a3a; --star:#f0b93a; --shadow:0 4px 16px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111113; --surface:#1e1e21; --surface2:#2b2b2f; --fg:#f4f4f1; --muted:#a4a4aa; --line:#2c2c31;
  --accent:#5b78ff; --accent-fg:#ffffff; --plus:#e57ad6; --deal:#e2523e; --deal-fg:#ffffff; --good:#5fcf95; --good-bg:#16301f; --value-bg:#3a1d19;
  --band:#1f5a38;--stage:#050506; --map:#34465a; --road:#5a6a80; --roadedge:#465770; --road2:#7b8aa8; --block:#252a30; --park:#1f5c58; --water:#2150b8; --shore:#55634f; --maplabel:#a9b6cb; --maplabel2:#d0d9e8; --waterlabel:#8fb0ff; --shade:#1d2a3a; --star:#f0b93a; --shadow:0 4px 16px rgba(0,0,0,.5); color-scheme:dark}
html,body{height:100%}
body{background:var(--stage);color:var(--fg);font:15px/1.35 var(--body);display:flex;justify-content:center;align-items:center;gap:40px}
*{box-sizing:border-box} button,input,textarea{font:inherit;color:inherit} button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.phone{position:relative;width:402px;max-width:100%;height:min(100%,860px);background:var(--bg);overflow:hidden;border-radius:38px;box-shadow:0 20px 60px rgba(0,0,0,.25);border:1px solid var(--line)}
.side{width:280px;display:flex;flex-direction:column;gap:12px}
.side h1{font:800 26px/1.1 var(--display);margin:0}.side p{margin:0;color:var(--muted)}
.side button{background:var(--fg);color:var(--bg);border-radius:99px;padding:11px 16px;font-weight:600;text-align:center}
.side button.alt{background:var(--surface2);color:var(--fg)}
@media (max-width:820px){.side{display:none}.phone{width:100%;height:100%;border-radius:0;border:0;box-shadow:none}}
#screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding-bottom:96px;scrollbar-width:none}
#screen::-webkit-scrollbar,.rail::-webkit-scrollbar{display:none}
h2{font:700 23px/1.15 var(--display);margin:0;letter-spacing:-.02em;text-wrap:balance} h3{font:600 17px/1.2 var(--body);margin:0}
.muted{color:var(--muted)} .pad{padding:0 16px}
.circ{width:36px;height:36px;border-radius:50%;background:var(--surface);display:grid;place-items:center;flex:none}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.hrow{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 6px}
.loc{display:flex;align-items:center;gap:10px;font:600 18px var(--body)}
.bell{position:relative}.badge{position:absolute;top:-6px;right:-8px;background:var(--good);color:var(--bg);font:700 11px var(--body);min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.modes{display:flex;gap:22px;padding:8px 16px 0;overflow-x:auto;scrollbar-width:none}
.modes button{font:600 18px var(--display);color:var(--muted);padding-bottom:10px;border-bottom:3px solid transparent;white-space:nowrap}
.modes button.on{color:var(--fg);border-color:var(--fg)}
.sec{padding:20px 0;border-bottom:1px solid var(--line)}
.sec-h{display:flex;align-items:center;gap:12px;padding:0 16px 12px}.sec-h>div{flex:1;min-width:0}.sec-h p{margin:2px 0 0;color:var(--muted)}
.rail{display:flex;gap:10px;overflow-x:auto;padding:0 16px;scroll-snap-type:x proximity;scrollbar-width:none}
.rail>*{flex:none;scroll-snap-align:start}
.art{background:linear-gradient(135deg,hsl(var(--h,30) 70% 84%),hsl(calc(var(--h,30) + 35) 72% 66%));background-size:cover;background-position:center;display:grid;place-items:center;overflow:hidden;position:relative}
.art>span{font-size:3.2em;line-height:1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.18))}
.editing .art{outline:2px dashed var(--accent);outline-offset:-4px;cursor:copy}
.card{width:262px;text-align:left;cursor:pointer}.card.full{width:auto;margin:0 16px 22px}
.card .art{aspect-ratio:16/9;border-radius:12px;border:1px solid var(--line);font-size:20px}
.tags{position:absolute;top:8px;left:8px;display:flex;gap:5px}
.tag{font:600 12.5px var(--body);padding:3px 7px;border-radius:5px;background:var(--good-bg);color:var(--good);white-space:nowrap}
.tag.value{background:var(--value-bg);color:var(--deal)}.tag.plain{background:var(--surface);color:var(--muted)}
.card .nm{display:flex;justify-content:space-between;gap:8px;margin-top:8px}.card .nm b{font:700 18px/1.2 var(--display);letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.heart.on svg{fill:var(--deal);stroke:var(--deal)}
.meta{font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;margin-top:2px}
.plus{color:var(--plus);font-weight:500}.promo{background:var(--deal);color:var(--deal-fg);font:600 12.5px var(--body);padding:2px 6px;border-radius:4px}
.rate{color:var(--fg);font-weight:600;display:inline-flex;align-items:center;gap:2px}.rate svg{color:var(--star)}
.logo{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);font-size:9px;flex:none}
.icard{width:150px;text-align:left;position:relative;cursor:pointer}.icard .art{aspect-ratio:1;border-radius:12px;background-color:var(--surface);font-size:16px}
.add{position:absolute;right:6px;bottom:6px;width:34px;height:34px;border-radius:50%;background:var(--bg);box-shadow:var(--shadow);display:grid;place-items:center}
.icard .p{margin-top:6px;font-weight:600}.icard .p.deal{color:var(--deal)}.was{color:var(--muted);text-decoration:line-through;font-weight:400;margin-left:4px}
.icard .n{color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding:0 16px;scrollbar-width:none}
.chip{background:var(--surface);border-radius:99px;padding:9px 14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:none}
.chip.on{background:var(--fg);color:var(--bg)}
.box{margin:14px 16px;border:2px solid var(--surface);border-radius:16px;padding:14px}
.banner{margin:16px;border-radius:14px;background:var(--good-bg);padding:16px;display:flex;gap:10px;align-items:center}
.banner h3{font:700 18px/1.2 var(--display)}.banner .art{width:96px;height:96px;border-radius:50%;flex:none;font-size:14px}
.btn{background:var(--fg);color:var(--bg);border-radius:99px;padding:11px 18px;font-weight:600;display:inline-flex;gap:6px;align-items:center;justify-content:center}
.btn.light{background:var(--bg);color:var(--fg)}.btn.grey{background:var(--surface);color:var(--fg)}.btn.wide{width:100%;padding:15px;font-size:16px}
.nav{position:absolute;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:center;z-index:8}
.nav button{height:50px;min-width:50px;border-radius:25px;background:var(--bg);border:1px solid var(--line);box-shadow:var(--shadow);display:grid;place-items:center;position:relative;color:var(--muted)}
.nav button.on{color:var(--fg)}.nav button.on svg{fill:currentColor}.nav .srch{flex:1;display:flex;gap:8px;justify-content:center;align-items:center;font-weight:600;font-size:16px}
.nav.compact .srch{flex:none}.nav .badge{top:-3px;right:-2px}
.pill{position:absolute;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:8;background:var(--accent);color:var(--accent-fg);border-radius:99px;padding:6px 6px 6px 16px;display:flex;gap:10px;align-items:center;font:600 17px var(--body);box-shadow:var(--shadow);font-variant-numeric:tabular-nums}
.pill .logo{width:34px;height:34px;border:0}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:140px;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;z-index:30;max-width:86%;text-align:center}
.editbar{position:absolute;top:0;left:0;right:0;z-index:20;background:var(--accent);color:var(--accent-fg);padding:8px 16px;display:flex;justify-content:space-between;font-weight:600}
.hd{display:flex;align-items:center;padding:14px 16px;gap:12px}.hd h3{flex:1;text-align:center;font:600 19px var(--body)}.hd .sp{width:36px}
.big{font:800 34px/1.05 var(--display);letter-spacing:-.03em;margin:0}
.tabs{display:flex;border-bottom:3px solid var(--surface)}.tabs button{flex:1;padding:12px;font-weight:600;display:flex;gap:8px;justify-content:center;margin-bottom:-3px;border-bottom:3px solid transparent}.tabs button.on{border-color:var(--fg)}
.orow{display:flex;gap:14px;padding:16px;border-bottom:1px solid var(--line);align-items:center}.orow .art{width:64px;height:64px;border-radius:50%;flex:none;font-size:11px}.orow>div{flex:1;min-width:0}
.stars{display:flex;gap:8px;margin-top:8px;color:var(--surface2)}.stars .lit{color:var(--star)}
.lst button{display:flex;gap:18px;align-items:center;width:100%;text-align:left;padding:13px 20px}.lst b{font:600 18px var(--body);display:block}.lst small{color:var(--muted);font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 16px}.tiles button{background:var(--surface);border-radius:14px;padding:16px 6px;font-weight:600;display:grid;gap:8px;justify-items:center}
.pcard{margin:12px 16px 0;background:var(--surface);border-radius:14px;padding:14px;display:flex;gap:10px;align-items:center;text-align:left;width:calc(100% - 32px)}.pcard>div{flex:1}
.avatar{width:58px;height:58px;border-radius:50%;background:var(--plus);color:var(--bg);display:grid;place-items:center;font:700 20px var(--display)}
.empty{display:grid;justify-items:center;text-align:center;gap:10px;padding:90px 32px}.empty .art{width:120px;height:120px;border-radius:50%;font-size:16px}
.mapw{position:relative;overflow:hidden;background:var(--map)}.mapw>svg{display:block;width:100%;height:100%}
.pinm{position:absolute;transform:translate(-50%,-50%);background:var(--bg);border-radius:99px;padding:5px 10px;font-weight:700;box-shadow:var(--shadow);display:flex;gap:4px;align-items:center;font-size:14px}
.pinm i{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-style:normal;white-space:nowrap}
.dot{position:absolute;width:20px;height:20px;border-radius:50%;transform:translate(-50%,-50%);border:4px solid var(--bg);box-shadow:var(--shadow)}
.call{position:absolute;width:max-content;max-width:240px;transform:translate(8px,-110%);background:var(--bg);padding:8px 12px;box-shadow:var(--shadow);display:flex;gap:8px;align-items:center;font-size:14px}.call b{display:block;font-size:16px}
.sheetbody{position:relative;background:var(--bg);border-radius:24px 24px 0 0;margin-top:-24px;padding-top:10px;min-height:60%}
.grab{width:44px;height:4px;border-radius:2px;background:var(--surface2);margin:0 auto 12px}
.prog{display:flex;gap:7px;padding:16px}.prog i{flex:1;height:4px;background:var(--surface)}.prog i.on{background:var(--accent)}
.float{position:absolute;top:14px;z-index:3;background:var(--bg);box-shadow:var(--shadow);border-radius:99px;height:44px;min-width:44px;padding:0 12px;display:flex;gap:6px;align-items:center;justify-content:center;font-weight:600}
.irow{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer}.irow>div:first-child{flex:1;min-width:0}.irow .art{width:104px;height:104px;border-radius:12px;font-size:13px;flex:none}.irow .w{position:relative}
.cartbar{position:absolute;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:9}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end}
.sheet{background:var(--bg);width:100%;max-height:88%;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
.sheet label{display:grid;gap:4px;font-weight:600;font-size:14px}.sheet input[type=text],.sheet textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
.sheet textarea{min-height:70px;resize:vertical}.sheet textarea.code{font:12px/1.4 ui-monospace,Menlo,monospace;min-height:180px}
.opt{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);flex:none}.opt.on .radio{border:6px solid var(--fg)}.radio.sq{border-radius:5px}
.step{display:inline-flex;align-items:center;gap:12px;background:var(--surface);border-radius:99px;padding:5px 10px;font-weight:600;font-variant-numeric:tabular-nums}
.tot{display:flex;justify-content:space-between;padding:4px 0;font-variant-numeric:tabular-nums}
.note{background:var(--surface);border-radius:10px;padding:10px 12px;font-size:13.5px;color:var(--muted)}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px 6px;padding:0 16px}.grid5 button{display:grid;gap:6px;justify-items:center;font-weight:600;font-size:13px}.grid5 .art{width:100%;aspect-ratio:1;border-radius:12px;font-size:9px}
.who{display:grid;gap:4px;justify-items:center;width:84px;text-align:center;font-weight:600;font-size:14px}.who .logo{width:76px;height:76px;font-size:14px}
.sw{width:44px;height:26px;border-radius:13px;background:var(--surface2);position:relative;flex:none}.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--bg);transition:left .15s}.on>.sw{background:var(--good)}.on>.sw::after{left:21px}

.band{padding-bottom:0}.band.on{background:linear-gradient(to bottom,var(--band) calc(100% - 66px),var(--bg) 0);color:#fff}
.ocard{margin:0 16px 14px;background:var(--bg);color:var(--fg);border-radius:16px;border:1px solid var(--line);box-shadow:var(--shadow);padding:14px;cursor:pointer}
.ocard .logo{width:56px;height:56px}
.catrow{display:flex;gap:16px;overflow-x:auto;padding:16px 16px 6px;scrollbar-width:none}
.catrow button{flex:none;display:grid;gap:4px;justify-items:center;font-weight:600;font-size:14px;min-width:60px}
.cico{width:56px;height:56px;display:grid;place-items:center;font-size:38px;line-height:1}
.cico.red{background:var(--deal);color:var(--deal-fg);border-radius:50%;font:700 19px var(--display);transform:scale(.82)}
.near{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 8px;padding:0 16px}
.near .who{width:auto;min-width:0}.near .lw{position:relative;width:100%}.near .lw .logo{width:100%;height:auto;aspect-ratio:1;font-size:12px}
.near .lw .tag{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);background:var(--bg)}
.tag.solid{background:var(--deal)!important;color:var(--deal-fg)!important}
.near .nm1{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:8px}
.shopban{background:var(--accent);color:var(--accent-fg);margin:22px 16px;border-radius:20px;padding:18px 0}
.sb-h{display:flex;justify-content:space-between;padding:0 16px 14px;gap:10px;cursor:pointer}
.sb-h h2{display:flex;gap:6px;align-items:center;color:inherit}.sb-h p{margin:4px 0 0;opacity:.92}.sbart{width:92px;height:62px;border-radius:10px;flex:none;font-size:11px}
.shopban .rail{padding:0 16px}
.sbcard{width:268px;background:var(--bg);color:var(--fg);border-radius:14px;padding:14px;cursor:pointer}
.sbh{display:flex;gap:10px;align-items:center;margin-bottom:10px}.sbh h3{display:flex;gap:4px;align-items:center;font:700 19px var(--display)}
.logo.sm{width:40px;height:40px}.mini{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mi{aspect-ratio:1;border-radius:10px;font-size:11px;background-color:var(--surface)}
.off{position:absolute;top:6px;left:6px;font-size:12px}

.mapw>svg.route{position:absolute;inset:0}
.courier{display:flex;gap:8px;align-items:center;padding:4px 16px 12px}.courier>div:last-child{font-size:18px;line-height:1.5}
.cav{position:relative;display:flex;align-items:center;padding-bottom:14px;flex:none}
.cavimg{width:74px;height:74px;border-radius:50%;font-size:12px;border:3px solid var(--bg);z-index:1}
.carimg{width:96px;height:56px;margin-left:-16px;border-radius:12px;font-size:10px}
.thumb{position:absolute;left:0;bottom:0;z-index:2;background:var(--bg);box-shadow:var(--shadow);border-radius:99px;padding:3px 10px;display:flex;gap:4px;align-items:center;font-weight:600;font-size:15px}
.cname{color:var(--good);font:600 20px var(--body)}
.cact{display:flex;gap:10px;padding:0 16px 18px;border-bottom:1px solid var(--line)}.cact .circ{width:52px;height:46px;border-radius:23px}
.pillb{background:var(--surface);border-radius:99px;height:46px;padding:0 20px;display:flex;gap:8px;align-items:center;justify-content:center;font-weight:600;font-size:17px}
.cact .pillb:nth-child(2){flex:1}
.prog i.part{background:linear-gradient(90deg,var(--accent) 60%,var(--surface) 0)}
.chat{display:grid;gap:8px;max-height:240px;overflow-y:auto;align-content:start}
.bub{background:var(--surface);padding:10px 14px;border-radius:16px 16px 16px 4px;max-width:82%;justify-self:start}
.bub.me{background:var(--fg);color:var(--bg);border-radius:16px 16px 4px 16px;justify-self:end}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
@media (max-width:820px){body{background:var(--bg)}}
</style>


</head>
<body>
<div class="phone" id="phone">
  <div id="screen"></div>
  <div id="chrome"></div>
  <div id="sheets"></div>
  <input type="file" id="filepick" accept="image/*" hidden>
</div>
<aside class="side">
  <h1 id="sideName">Forkful</h1>
  <p>A working food-ordering prototype with a placeholder brand and made-up restaurants. Browse, add to cart, check out, and watch the order move through its stages.</p>
  <button data-side="custom">Customize brand and data</button>
  <button class="alt" data-side="edit">Replace images</button>
  <button data-side="adv">Next order stage</button>
  <button class="alt" data-side="reset">Reset demo</button>
  <button class="alt" data-side="msgs">Edit messages</button>
  <p>No payment is taken and no real order is placed.</p>
</aside>

 track:a=>go({name:'track',id:a}), checkout:a=>go({name:'checkout',sid:a,tip:3,speed:'Standard'}),
 catgo:a=>{if(a==='grocery'){st.mode='Grocery';render();return}const ids=a==='deals'?STORES.filter(s=>s.promo&&s.kind!=='retail').map(s=>s.id):STORES.filter(s=>s.cuisine===a).map(s=>s.id);go({name:'list',title:a==='deals'?'Meal Deals':a,ids})},
 chipgo:a=>{if(a==='Schedule')return toast('Scheduling is not available in this demo');const f={Plus:s=>!s.far,Offers:s=>s.promo,'Under 30 min':s=>s.eta<30}[a]||(()=>true);go({name:'list',title:a==='Plus'?C.plus:a,ids:STORES.filter(s=>s.kind!=='retail'&&f(s)).map(s=>s.id)})},
 mode:a=>{if(a==='Pickup')return A.tab('pickup');st.mode=a;render()},
 fav:a=>{st.favs.has(a)?st.favs.delete(a):st.favs.add(a);document.querySelectorAll(`.heart[data-a="${a}"]`).forEach(e=>e.classList.toggle('on',st.favs.has(a)));toast(st.favs.has(a)?'Saved to favorites':'Removed from favorites')},
 cat:a=>{st.cats.has(a)?st.cats.delete(a):st.cats.add(a);render(1)}, filt:a=>{st.filt.has(a)?st.filt.delete(a):st.filt.add(a);render(1)},
 quick:(a,b)=>{addLine(a,+b);chrome();toast('Added '+flat(store(a))[+b][0])},
 item:(a,b)=>{sh={sid:a,i:+b,qty:1,size:0,ex:new Set(),note:''};itemSheet()},
 size:a=>{sh.size=+a;itemSheet()}, ex:a=>{sh.ex.has(+a)?sh.ex.delete(+a):sh.ex.add(+a);itemSheet()}, shq:a=>{sh.qty=Math.max(1,sh.qty+ +a);itemSheet()},
 addsheet:()=>{addLine(sh.sid,sh.i,sh.qty,sh.size,[...sh.ex].sort(),sh.note);sheet('');render(1);toast('Added to cart')},
 qty:(a,b)=>{const l=st.cart[+a];l.qty+=+b;if(l.qty<1)st.cart.splice(+a,1);render(1)},
 tip:a=>{cur().tip=+a;render(1)}, speed:a=>{cur().speed=a;render(1)},
 place:()=>{const r=cur(),t=totals(r),ls=st.cart.filter(l=>l.sid===r.sid);if(!ls.length)return;const o={id:Date.now(),sid:r.sid,lines:ls.map(l=>[l.i,l.qty]),total:t.total,placed:Date.now(),eta:store(r.sid).eta-(r.speed==='Priority'?5:0)};st.active.push(o);st.cart=st.cart.filter(l=>l.sid!==r.sid);st.stack=[{name:'home'},{name:'track',id:o.id}];render();toast('Demo order placed')},
 reorder:a=>{const o=st.history[+a];o.lines.forEach(([i,q])=>addLine(o.sid,i,q));A.tab('cart');toast('Items added to your cart')},
 rate:(a,b)=>{st.history[+a].rated=+b;render(1);toast('Thanks for the rating')},
 otab:a=>{st.otab=a;render()}, q:a=>{st.q=a;st.stack=[{name:'search'}];render()},
 reserve:a=>toast('Table requested at '+store(a).name), offer:()=>toast('Offer saved to your account'), promo:()=>toast($('#promo').value.trim()?'That code is not valid in the demo':'Enter a code first'),
 sw:(a,b,el)=>el.classList.toggle('on'), details:()=>{cur().open=!cur().open;render(1)},
 notif:()=>{st.notif=0;chrome();sheet(shHd('Notifications')+[['Your order is being prepared',store(st.active[0]?.sid||'saffron').name],['Buy 1, get 1 this week',store('griddle').name],['Rate your last order',store('greenhouse').name]].map(([a,b])=>`<div class="opt"><span><b>${esc(a)}</b><br><span class="muted">${esc(b)}</span></span></div>`).join(''));render(1)},
 addr:()=>sheet(shHd('Delivery address')+`<label for="addr">Street address<input id="addr" type="text" value="${esc(C.address)}"></label><button class="btn wide" data-act="saveaddr">Save address</button>`),
 saveaddr:()=>{C.address=$('#addr').value.trim()||C.address;persist();sheet('');render(1);toast('Address updated')},
 instr:()=>sheet(shHd('Delivery instructions')+`<label for="instr">Note for your courier<textarea id="instr" placeholder="Gate code, where to leave it…">${esc(st.instr)}</textarea></label><button class="btn wide" data-act="saveinstr">Save</button>`),
 saveinstr:()=>{st.instr=$('#instr').value.trim();sheet('');cur().open=true;render(1);toast('Instructions saved')},
 help:()=>sheet(shHd('Help')+`<div class="note">This is a demo order. Move it forward whenever you like, or let a new order advance on its own.</div><button class="btn wide" data-act="advance">Demo: next order stage</button><button class="btn grey wide" data-act="cancel">Cancel this order</button>`),
 advance:()=>{const o=st.active[st.active.length-1];if(!o)return toast('No active order');const g=Math.min(5,stage(o)+1);o.fixed=g;o.stageAt=Date.now();if(g===5)o.doneAt=Date.now();sheet('');render(1);toast(stageTitle(g))},
 applymsgs:()=>{const ln=id=>$('#'+id).value.split('\n').map(x=>x.trim()).filter(Boolean);st.chat=ln('c_chat').map(l=>/^me:\s*/i.test(l)?{me:1,t:l.replace(/^me:\s*/i,'')}:{me:0,t:l});C.chat=st.chat.map(m=>({...m}));C.quick=ln('c_quick');C.replies=ln('c_rep');persist();toast('Messages saved')},
 call:()=>toast('Calling is turned off in this demo'),
 msg:()=>chatSheet(), qmsg:a=>sendMsg(a),
 tipc:()=>sheet(shHd('Tip '+esc(C.courier))+`<p class="muted" style="margin:0">All of your tip goes to your courier. No payment is taken in this demo.</p><div class="chips">${[2,3,5,8].map(v=>`<button class="chip ${st.ctip===v?'on':''}" data-act="tipset" data-a="${v}">${money(v)}</button>`).join('')}</div>`),
 tipset:a=>{st.ctip=+a;sheet('');render(1);toast('Tip of '+money(+a)+' added')},
 cancel:()=>{st.active=st.active.filter(o=>o.id!=cur().id);sheet('');A.tab('home');toast('Order canceled')},
 custom:()=>customSheet(), close:()=>sheet(''), scrim:(a,b,el,e)=>{if(e.target===el)sheet('')},
 editon:()=>{st.edit=true;sheet('');chrome()}, editoff:()=>{st.edit=false;chrome()},
 applyjson:()=>{try{const d=JSON.parse($('#c_json').value);if(!Array.isArray(d)||!d.every(s=>s.id&&s.name&&s.menu))throw new Error('Each store needs an id, a name and a menu.');const ids=new Set(d.map(s=>s.id));STORES=d;st.cart=st.cart.filter(l=>ids.has(l.sid)&&flat(store(l.sid))[l.i]);persist();sheet('');render(1);toast('Stores saved')}catch(err){customSheet('Could not apply: '+err.message)}},
 reset:()=>{seed();sheet('');render();toast('Demo reset. Your brand, messages, stores and images are kept.')},
 factory:(a,b,el)=>{if(!el.dataset.sure){el.dataset.sure=1;el.textContent='Tap again to erase all my customizations';setTimeout(()=>{if(el.isConnected){delete el.dataset.sure;el.textContent='Restore factory defaults'}},4000);return}
  STORES=JSON.parse(DEFAULT_STORES);Object.keys(ASSETS).forEach(k=>delete ASSETS[k]);Object.keys(C).forEach(k=>delete C[k]);Object.assign(C,JSON.parse(DEFAULT_C));try{localStorage.removeItem(SAVE_KEY)}catch(e){}seed();sheet('');render();toast('Factory defaults restored')},
};
let pickKey=null;
$('#phone').addEventListener('click',e=>{
 if(st.edit){const a=e.target.closest('[data-asset]');if(a&&!e.target.closest('.editbar')){e.preventDefault();e.stopPropagation();pickKey=a.dataset.asset;$('#filepick').click();return}}
 const el=e.target.closest('[data-act]');if(!el)return;const f=A[el.dataset.act];if(f)f(el.dataset.a,el.dataset.b,el,e)});
$('#phone').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button]')){e.preventDefault();e.target.click()}});
$('#phone').addEventListener('submit',e=>{if(e.target.id==='cform'){e.preventDefault();const m=$('#msg'),v=m.value;m.value='';sendMsg(v)}});
$('#phone').addEventListener('input',e=>{const t=e.target;
 if(t.id==='q'){st.q=t.value;$('#results').innerHTML=searchBody()}
 else if(t.id==='note'&&sh)sh.note=t.value;
 else if(t.dataset.cfg){C[t.dataset.cfg]=t.value;persist();render(1)}});
$('#filepick').addEventListener('change',e=>{const f=e.target.files[0];if(!f||!pickKey)return;const fr=new FileReader();fr.onload=()=>{ASSETS[pickKey]=fr.result;persist();render(1);toast('Image replaced')};fr.readAsDataURL(f);e.target.value=''});
document.querySelector('.side').addEventListener('click',e=>{const k=e.target.dataset.side;if(k==='custom')A.custom();if(k==='edit'){st.edit=!st.edit;chrome()}if(k==='reset')A.reset();if(k==='adv')A.advance();if(k==='msgs'){A.custom();const t=$('#c_chat');if(t)t.scrollIntoView({block:'center'})}});
let last='';
setInterval(()=>{const done=st.active.filter(o=>o.fixed!=null?(o.fixed>=5&&Date.now()-(o.doneAt||0)>8000):Date.now()-o.placed>STAGE_MS*6);if(done.length){done.forEach(o=>st.history.unshift({sid:o.sid,date:'Today',total:o.total,lines:o.lines,rated:0,ask:1}));st.active=st.active.filter(o=>!done.includes(o))}
 const sig=st.active.map(o=>o.id+':'+stage(o)).join();const r=cur();
 if(sig!==last){last=sig;if(!$('#sheets').innerHTML&&['track','orders','home'].includes(r.name))render(1);else chrome()}
 const cd=$('#cd'),o=st.active.find(o=>o.id==r.id);if(cd&&o)cd.textContent=countdown(o);placeCourier()},1000);
render();
</script>
